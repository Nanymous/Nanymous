<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Nanymous — futuristic developer hero banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050810"/>
      <stop offset="0.55" stop-color="#0B1226"/>
      <stop offset="1" stop-color="#121C42"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="lineFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#A855F7" stop-opacity="0.9"/>
      <stop offset="0.8" stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#00E5FF" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <circle cx="230" cy="110" r="190" fill="url(#orbCyan)">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="990" cy="280" r="210" fill="url(#orbPurple)">
    <animate attributeName="opacity" values="1;0.6;1" dur="7.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="420" r="180" fill="url(#orbBlue)"/>

  <g stroke="#00E5FF" stroke-opacity="0.14" stroke-width="1">
    <path d="M600 338L-240 400M600 338L-60 400M600 338L120 400M600 338L300 400M600 338L480 400M600 338L600 400M600 338L720 400M600 338L900 400M600 338L1080 400M600 338L1260 400M600 338L1440 400"/>
    <path d="M0 346H1200M0 356H1200M0 368H1200M0 382H1200M0 398H1200" stroke-opacity="0.10"/>
  </g>
  <rect x="0" y="337" width="1200" height="1.5" fill="url(#lineFade)" opacity="0.55">
    <animate attributeName="opacity" values="0.35;0.75;0.35" dur="5s" repeatCount="indefinite"/>
  </rect>

  <g fill="none" stroke="url(#neon)" stroke-width="1.5" stroke-opacity="0.4">
    <path d="M30 118H122L152 148H244" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" values="0;-32" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M1170 118H1078L1048 148H956" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" values="0;-32" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M30 300H92L112 280H170" stroke-dasharray="4 12" stroke-opacity="0.25">
      <animate attributeName="stroke-dashoffset" values="0;32" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M1170 300H1108L1088 280H1030" stroke-dasharray="4 12" stroke-opacity="0.25">
      <animate attributeName="stroke-dashoffset" values="0;32" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#00E5FF">
    <circle cx="244" cy="148" r="2.5" opacity="0.8">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="956" cy="148" r="2.5" opacity="0.8">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="280" r="2" opacity="0.5"/>
    <circle cx="1030" cy="280" r="2" opacity="0.5"/>
  </g>

  <g>
    <circle cx="140" cy="380" r="1.8" fill="#00E5FF">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -320" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="390" r="1.4" fill="#A855F7">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -340" dur="10s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="10s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="385" r="2" fill="#38BDF8">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -330" dur="9s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="9s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="395" r="1.5" fill="#00E5FF">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -350" dur="11s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="11s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="380" r="2" fill="#A855F7">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -320" dur="8.5s" begin="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="8.5s" begin="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="390" r="1.6" fill="#38BDF8">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -340" dur="9.5s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="9.5s" begin="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="0" y="-80" width="1200" height="70" fill="url(#scan)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 500" dur="7s" repeatCount="indefinite"/>
  </rect>

  <g stroke="#00E5FF" stroke-opacity="0.55" stroke-width="2" fill="none">
    <path d="M30 54V30H54"/>
    <path d="M1146 30H1170V54"/>
    <path d="M30 346V370H54"/>
    <path d="M1146 370H1170V346"/>
  </g>

  <g font-family="Consolas, Monaco, 'Courier New', monospace" font-size="11" letter-spacing="2">
    <circle cx="48" cy="45" r="3.5" fill="#22C55E">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="60" y="49" fill="#22C55E" opacity="0.85">SYSTEM ONLINE</text>
    <text x="1154" y="49" fill="#6E7681" text-anchor="end">// PROFILE.README</text>
  </g>

  <text x="600" y="146" text-anchor="middle" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="15" letter-spacing="7" fill="#8B949E">HELLO WORLD, I AM</text>

  <text x="600" y="234" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="86" letter-spacing="12" fill="url(#neon)" filter="url(#softGlow)" opacity="0.55">NANYMOUS</text>
  <text x="600" y="234" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="86" letter-spacing="12" fill="url(#neon)" filter="url(#glow)">NANYMOUS</text>

  <rect x="440" y="256" width="320" height="2.5" rx="1.25" fill="url(#lineFade)"/>
  <rect x="440" y="256" width="60" height="2.5" rx="1.25" fill="#FFFFFF" opacity="0.85" filter="url(#glow)">
    <animate attributeName="x" values="440;700;440" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <text x="600" y="298" text-anchor="middle" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="15" letter-spacing="2.5" fill="#C9D1D9">DART · FLUTTER · PYTHON · PHP · LARAVEL · THREE.JS</text>

  <rect x="0" y="398" width="1200" height="2" fill="url(#lineFade)" opacity="0.7"/>
</svg>