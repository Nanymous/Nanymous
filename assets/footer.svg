<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Animated footer with neon waves">
  <defs>
    <linearGradient id="fBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050810"/>
      <stop offset="1" stop-color="#0B1226"/>
    </linearGradient>
    <linearGradient id="fNeon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="fLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A855F7" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="fGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="200" fill="url(#fBg)"/>
  <rect x="0" y="0" width="1200" height="1.8" fill="url(#fLine)" opacity="0.7"/>

  <g fill="#00E5FF">
    <circle cx="180" cy="40" r="1.5">
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="26" r="1.2">
      <animate attributeName="opacity" values="0.9;0.15;0.9" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="34" r="1.6" fill="#A855F7">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1010" cy="48" r="1.3" fill="#38BDF8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="24" r="1.1">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="600" y="82" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="34" letter-spacing="6" fill="url(#fNeon)" filter="url(#fGlow)">THANKS FOR VISITING</text>
  <text x="600" y="112" text-anchor="middle" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="13.5" letter-spacing="2" fill="#8B949E">// always learning, always building</text>

  <g opacity="0.28" fill="#38BDF8">
    <path d="M0 150Q150 122 300 150T600 150T900 150T1200 150T1500 150T1800 150T2100 150T2400 150V200H0Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;-600 0" dur="11s" repeatCount="indefinite"/>
    </path>
  </g>
  <g opacity="0.32" fill="#A855F7">
    <path d="M0 162Q150 138 300 162T600 162T900 162T1200 162T1500 162T1800 162T2100 162T2400 162V200H0Z">
      <animateTransform attributeName="transform" type="translate" values="-600 0;0 0" dur="8s" repeatCount="indefinite"/>
    </path>
  </g>
  <g opacity="0.4" fill="#00E5FF">
    <path d="M0 176Q150 156 300 176T600 176T900 176T1200 176T1500 176T1800 176T2100 176T2400 176V200H0Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;-600 0" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
  <rect x="0" y="198" width="1200" height="2" fill="url(#fLine)"/>
</svg>