<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="img" aria-label="Section divider">
  <defs>
    <linearGradient id="dLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#00E5FF" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#A855F7" stop-opacity="0.85"/>
      <stop offset="0.82" stop-color="#00E5FF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="dGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="60" y="11" width="1080" height="1.8" rx="0.9" fill="url(#dLine)"/>
  <g filter="url(#dGlow)">
    <circle cy="12" r="3" fill="#00E5FF">
      <animate attributeName="cx" values="80;1120" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cy="12" r="2.4" fill="#A855F7">
      <animate attributeName="cx" values="1120;80" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="594" y="6" width="12" height="12" rx="2" transform="rotate(45 600 12)" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.9">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>